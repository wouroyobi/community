<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Identity — Wouro Yobi Living Archive</title>
<meta name="description" content="Who are the people of Wouro Yobi? An introduction to a Mbororo community in the Adamawa region of Cameroon — its geography, name, traditions, values and leadership — documented by its own people.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Inter:wght@400;500;600&family=Inter+Tight:wght@500;600&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     DESIGN TOKENS — identical to the homepage. Do not alter.
     ============================================================ */
  :root{
    --forest: #16332A;
    --forest-deep: #0E211B;
    --emerald: #2E6B54;
    --sage: #A9BBA2;
    --sage-pale: #E4E8DE;
    --beige: #F3EEE1;
    --beige-warm: #ECE3CE;
    --brown: #6B4A30;
    --gold: #C79A4B;
    --gold-soft: #E4C583;
    --ink: #1E2420;
    --ink-soft: #4B564E;
    --white: #FFFFFF;

    --font-display: 'Poppins', sans-serif;
    --font-body: 'Inter', sans-serif;
    --font-caption: 'Inter Tight', sans-serif;

    --max-w: 1280px;
    --edge: clamp(1.5rem, 5vw, 4.5rem);
    --radius-lg: 28px;
    --radius-md: 16px;
    --radius-sm: 8px;
    --shadow-soft: 0 20px 60px -25px rgba(14,33,27,0.35);
    --shadow-card: 0 12px 34px -18px rgba(14,33,27,0.28);
    --ease: cubic-bezier(.22,1,.36,1);
  }

  *,*::before,*::after{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  @media (prefers-reduced-motion: reduce){
    html{scroll-behavior:auto;}
    *{animation-duration:0.01ms !important; animation-iteration-count:1 !important; transition-duration:0.01ms !important; scroll-behavior:auto !important;}
  }
  body{
    margin:0;
    font-family:var(--font-body);
    color:var(--ink);
    background:var(--beige);
    -webkit-font-smoothing:antialiased;
    line-height:1.6;
  }
  img{max-width:100%; display:block;}
  a{color:inherit;}
  h1,h2,h3,h4{font-family:var(--font-display); margin:0; color:var(--forest-deep); font-weight:600; letter-spacing:-0.01em;}
  p{margin:0;}
  ul{margin:0; padding:0; list-style:none;}
  button{font-family:inherit; cursor:pointer;}

  :focus-visible{
    outline:2.5px solid var(--gold);
    outline-offset:3px;
    border-radius:4px;
  }

  .wrap{max-width:var(--max-w); margin:0 auto; padding-inline:var(--edge);}
  .eyebrow{
    font-family:var(--font-caption);
    font-size:0.75rem;
    letter-spacing:0.16em;
    text-transform:uppercase;
    color:var(--emerald);
    font-weight:600;
    display:inline-flex;
    align-items:center;
    gap:0.6em;
  }
  .eyebrow::before{
    content:"";
    width:22px; height:1.5px;
    background:var(--gold);
    display:inline-block;
  }
  .visually-hidden{position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0;}

  .reveal{opacity:0; transform:translateY(28px); transition:opacity 0.9s var(--ease), transform 0.9s var(--ease);}
  .reveal.is-visible{opacity:1; transform:none;}
  .reveal-stagger > *{transition-delay:calc(var(--i,0) * 90ms);}

  .skip-link{
    position:absolute; left:1rem; top:-4rem;
    background:var(--forest-deep); color:var(--white);
    padding:0.8rem 1.2rem; border-radius:var(--radius-sm);
    z-index:200; transition:top 0.25s var(--ease);
    font-family:var(--font-caption); font-weight:600;
  }
  .skip-link:focus{top:1rem;}

  /* ---------- header / nav (identical to homepage) ---------- */
  header.site-header{
    position:sticky; top:0; z-index:100;
    background:rgba(243,238,225,0.86);
    backdrop-filter:blur(14px) saturate(140%);
    border-bottom:1px solid rgba(107,74,48,0.14);
  }
  .nav-row{
    max-width:var(--max-w); margin:0 auto; padding:1.05rem var(--edge);
    display:flex; align-items:center; justify-content:space-between; gap:1.5rem;
  }
  .brand{display:flex; align-items:center; gap:0.7rem; text-decoration:none;}
  .brand-mark{
    width:38px; height:38px; border-radius:50%;
    background:conic-gradient(from 210deg, var(--forest), var(--emerald), var(--gold), var(--forest));
    display:grid; place-items:center; flex-shrink:0;
    box-shadow:inset 0 0 0 3px var(--beige);
  }
  .brand-mark span{width:12px; height:12px; border-radius:50%; background:var(--beige);}
  .brand-name{font-family:var(--font-display); font-size:1.02rem; font-weight:600; color:var(--forest-deep); line-height:1.1;}
  .brand-name small{display:block; font-family:var(--font-caption); font-weight:500; font-size:0.68rem; letter-spacing:0.08em; text-transform:uppercase; color:var(--brown); margin-top:0.2rem;}

  nav.primary-nav ul{display:flex; gap:2.1rem; align-items:center;}
  nav.primary-nav a{
    font-family:var(--font-caption); font-size:0.86rem; font-weight:500;
    text-decoration:none; color:var(--ink-soft);
    position:relative; padding-bottom:4px;
  }
  nav.primary-nav a::after{
    content:""; position:absolute; left:0; bottom:0; height:1.5px; width:0;
    background:var(--gold); transition:width 0.3s var(--ease);
  }
  nav.primary-nav a:hover::after, nav.primary-nav a:focus-visible::after{width:100%;}
  nav.primary-nav a[aria-current="page"]{color:var(--forest-deep);}
  nav.primary-nav a[aria-current="page"]::after{width:100%;}
  .nav-actions{display:flex; align-items:center; gap:0.8rem;}
  .btn{
    font-family:var(--font-caption); font-weight:600; font-size:0.85rem;
    padding:0.75rem 1.5rem; border-radius:999px; border:1.5px solid transparent;
    text-decoration:none; display:inline-flex; align-items:center; gap:0.5rem;
    transition:transform 0.35s var(--ease), background 0.35s var(--ease), color 0.35s var(--ease), border-color .35s var(--ease);
  }
  .btn-primary{background:var(--forest-deep); color:var(--beige);}
  .btn-primary:hover{background:var(--emerald); transform:translateY(-2px);}
  .btn-ghost{border-color:var(--forest-deep); color:var(--forest-deep);}
  .btn-ghost:hover{background:var(--forest-deep); color:var(--beige); transform:translateY(-2px);}
  .btn-gold{background:var(--gold); color:var(--forest-deep);}
  .btn-gold:hover{background:var(--gold-soft); transform:translateY(-2px);}
  .nav-toggle{display:none; background:none; border:none; padding:0.4rem;}
  @media (max-width:920px){
    nav.primary-nav, .nav-actions .btn-ghost{display:none;}
    .nav-toggle{display:block;}
  }

  /* ---------- placeholder image component (identical) ---------- */
  .ph{
    position:relative; overflow:hidden;
    background:linear-gradient(135deg, var(--sage-pale) 0%, var(--beige-warm) 55%, var(--sage-pale) 100%);
    border-radius:var(--radius-md);
    display:flex; align-items:flex-end;
    isolation:isolate;
    min-height:180px;
  }
  .ph::before{
    content:""; position:absolute; inset:0;
    background-image:
      repeating-linear-gradient(115deg, rgba(107,74,48,0.05) 0 2px, transparent 2px 26px),
      repeating-linear-gradient(25deg, rgba(46,107,84,0.05) 0 2px, transparent 2px 26px);
    z-index:0;
  }
  .ph::after{
    content:""; position:absolute; inset:0; z-index:0;
    background:
      radial-gradient(circle at 30% 20%, rgba(199,154,75,0.18), transparent 45%),
      radial-gradient(circle at 75% 80%, rgba(22,51,42,0.14), transparent 50%);
  }
  .ph-icon{
    position:absolute; top:1.1rem; right:1.1rem; z-index:1;
    width:34px; height:34px; border-radius:50%;
    background:rgba(255,255,255,0.55); backdrop-filter:blur(4px);
    display:grid; place-items:center;
  }
  .ph-icon svg{width:16px; height:16px; stroke:var(--forest-deep);}
  .ph-caption{
    position:relative; z-index:1; width:100%;
    padding:0.9rem 1.1rem; margin:0;
    background:linear-gradient(to top, rgba(14,33,27,0.72), rgba(14,33,27,0));
    color:var(--white);
  }
  .ph-caption .fname{font-family:var(--font-caption); font-size:0.78rem; font-weight:600; letter-spacing:0.02em;}
  .ph-caption .fdesc{display:block; font-size:0.72rem; opacity:0.85; margin-top:0.15rem;}
  .ph-caption .fdim{display:block; font-family:var(--font-caption); font-size:0.66rem; opacity:0.7; margin-top:0.35rem; letter-spacing:0.04em;}
  .ph-square{aspect-ratio:1/1;}
  .ph-portrait{aspect-ratio:3/4;}
  .ph-wide{aspect-ratio:16/9;}
  .ph-panorama{aspect-ratio:21/9;}

  /* ---------- context-reference image variant (new, for regional Wikimedia/Unsplash context) ---------- */
  .ref{
    position:relative; overflow:hidden; border-radius:var(--radius-md);
    background:linear-gradient(150deg, var(--sage) 0%, var(--forest) 100%);
    display:flex; align-items:flex-end; min-height:180px;
  }
  .ref::before{
    content:""; position:absolute; inset:0;
    background-image:
      repeating-linear-gradient(70deg, rgba(255,255,255,0.06) 0 3px, transparent 3px 22px);
    z-index:0;
  }
  .ref-badge{
    position:absolute; top:1.1rem; left:1.1rem; z-index:1;
    font-family:var(--font-caption); font-size:0.64rem; font-weight:600; letter-spacing:0.08em; text-transform:uppercase;
    background:rgba(255,255,255,0.9); color:var(--forest-deep); padding:0.32rem 0.7rem; border-radius:999px;
  }
  .ref-caption{
    position:relative; z-index:1; width:100%; padding:0.9rem 1.1rem;
    background:linear-gradient(to top, rgba(14,33,27,0.78), rgba(14,33,27,0));
    color:var(--white);
  }
  .ref-caption .fname{font-family:var(--font-caption); font-size:0.78rem; font-weight:600;}
  .ref-caption .fdesc{display:block; font-size:0.72rem; opacity:0.85; margin-top:0.15rem;}
  .ref-wide{aspect-ratio:16/9;}
  .ref-panorama{aspect-ratio:21/9;}

  /* ---------- section rhythm ---------- */
  section{padding-block:clamp(4rem, 8vw, 7.5rem); position:relative;}
  .section-head{max-width:64ch; margin-bottom:clamp(2.2rem, 5vw, 3.6rem);}
  .section-head h2{font-size:clamp(2rem, 3.6vw, 3rem); margin-top:0.9rem;}
  .section-head p{margin-top:1.1rem; font-size:1.06rem; color:var(--ink-soft); max-width:56ch;}

  /* ---------- breadcrumb (page-local) ---------- */
  .page-crumb{
    padding-block:1.1rem; border-bottom:1px solid rgba(107,74,48,0.14);
    font-family:var(--font-caption); font-size:0.8rem; color:var(--ink-soft);
  }
  .page-crumb a{text-decoration:none; color:var(--ink-soft);}
  .page-crumb a:hover{color:var(--emerald);}
  .page-crumb span[aria-hidden]{margin-inline:0.5rem; color:var(--gold);}
  .page-crumb strong{color:var(--forest-deep); font-weight:600;}

  /* ---------- hero (identical structure to homepage) ---------- */
  .hero{position:relative; padding-top:clamp(2.5rem, 6vw, 4.5rem); padding-bottom:clamp(3rem, 7vw, 6rem); overflow:hidden;}
  .hero-bg-shape{
    position:absolute; top:-15%; right:-12%; width:60vw; height:60vw; max-width:900px; max-height:900px;
    border-radius:50%; background:radial-gradient(circle at 35% 35%, rgba(46,107,84,0.14), rgba(46,107,84,0) 65%);
    z-index:0; pointer-events:none;
  }
  .hero-grid{position:relative; z-index:1; display:grid; grid-template-columns:1.05fr 0.95fr; gap:clamp(2rem,4vw,4rem); align-items:center;}
  @media (max-width:940px){ .hero-grid{grid-template-columns:1fr;} }
  .hero-eyebrow{margin-bottom:1.4rem;}
  .hero h1{font-size:clamp(2.6rem, 5.4vw, 4.4rem); line-height:1.04; font-weight:600; color:var(--forest-deep);}
  .hero h1 em{font-style:normal; color:var(--emerald); position:relative;}
  .hero-sub{margin-top:1.6rem; max-width:44ch; font-size:1.12rem; color:var(--ink-soft);}
  .hero-actions{margin-top:2.4rem; display:flex; flex-wrap:wrap; gap:1rem;}
  .hero-visual{position:relative;}
  .hero-visual .ref{min-height:420px; border-radius:var(--radius-lg); box-shadow:var(--shadow-soft);}
  .hero-visual .ph-float{
    position:absolute; width:44%; bottom:-8%; left:-10%;
    border:6px solid var(--beige); border-radius:var(--radius-md); box-shadow:var(--shadow-card);
    min-height:auto;
  }
  @media (max-width:700px){ .hero-visual .ph-float{display:none;} }

  /* ---------- editorial intro (dark band, identical treatment) ---------- */
  .editorial{background:var(--forest-deep); color:var(--sage-pale);}
  .editorial .wrap{display:grid; grid-template-columns:0.9fr 1.1fr; gap:clamp(2.5rem,5vw,5rem); align-items:start;}
  @media (max-width:920px){ .editorial .wrap{grid-template-columns:1fr;} }
  .editorial .eyebrow{color:var(--gold-soft);}
  .editorial .eyebrow::before{background:var(--gold-soft);}
  .editorial h2{color:var(--white); font-size:clamp(1.9rem,3.4vw,2.7rem); margin-top:1rem; line-height:1.18;}
  .editorial-drop{font-family:var(--font-display); font-size:4.2rem; line-height:0.7; float:left; margin-right:0.6rem; margin-top:0.4rem; color:var(--gold);}
  .editorial-body p{font-size:1.06rem; color:rgba(228,232,222,0.86); margin-top:1.2rem;}
  .editorial-body p:first-child{margin-top:0;}

  /* ---------- knowledge panel (identical, reusable) ---------- */
  .knowledge-panel{
    background:var(--beige-warm); border:1px solid rgba(107,74,48,0.18); border-radius:var(--radius-md);
    padding:1.5rem 1.6rem;
  }
  .knowledge-panel h4{
    font-family:var(--font-caption); font-size:0.72rem; letter-spacing:0.12em; text-transform:uppercase;
    color:var(--brown); font-weight:600; margin-bottom:0.9rem; display:flex; align-items:center; gap:0.5rem;
  }
  .knowledge-panel h4 svg{width:14px; height:14px; stroke:var(--brown);}
  .knowledge-panel ul{display:flex; flex-direction:column; gap:0.55rem;}
  .knowledge-panel a{
    display:flex; justify-content:space-between; align-items:center; gap:0.6rem;
    text-decoration:none; font-family:var(--font-caption); font-size:0.85rem;
    color:var(--forest-deep); padding:0.4rem 0; border-bottom:1px dashed rgba(107,74,48,0.22);
  }
  .knowledge-panel a:last-child{border-bottom:none;}
  .knowledge-panel a span.src{color:var(--ink-soft); font-weight:400;}
  .knowledge-panel a svg{width:12px; height:12px; stroke:var(--emerald); flex-shrink:0;}

  /* ---------- Where We Are: map + hierarchy ---------- */
  .where-grid{display:grid; grid-template-columns:1.2fr 0.8fr; gap:clamp(2rem,4vw,3.5rem); align-items:start;}
  @media (max-width:940px){ .where-grid{grid-template-columns:1fr;} }
  .map-frame{
    border-radius:var(--radius-lg); overflow:hidden; box-shadow:var(--shadow-card);
    border:1px solid rgba(107,74,48,0.14); background:var(--sage-pale);
  }
  .map-frame iframe{width:100%; height:380px; border:0; display:block; filter:saturate(0.85);}
  .map-meta{
    display:flex; justify-content:space-between; align-items:center; gap:1rem; flex-wrap:wrap;
    padding:1.1rem 1.4rem; background:var(--white); font-family:var(--font-caption); font-size:0.82rem; color:var(--ink-soft);
  }
  .map-meta strong{color:var(--forest-deep); font-family:var(--font-display); font-weight:600; font-size:0.95rem;}
  .hierarchy{margin-top:2rem; display:flex; flex-direction:column; gap:0;}
  .hierarchy-step{
    display:flex; align-items:center; gap:1rem; padding:0.9rem 0;
    border-bottom:1px dashed rgba(107,74,48,0.2);
  }
  .hierarchy-step:last-child{border-bottom:none;}
  .hierarchy-dot{width:10px; height:10px; border-radius:50%; background:var(--sage); flex-shrink:0;}
  .hierarchy-step.is-final .hierarchy-dot{background:var(--gold); box-shadow:0 0 0 4px rgba(199,154,75,0.18);}
  .hierarchy-label{font-family:var(--font-caption); font-size:0.68rem; text-transform:uppercase; letter-spacing:0.08em; color:var(--ink-soft);}
  .hierarchy-name{font-family:var(--font-display); font-size:1.08rem; color:var(--forest-deep); font-weight:600;}
  .hierarchy-step.is-final .hierarchy-name{color:var(--emerald);}

  /* ---------- Meaning of the name ---------- */
  .meaning-box{
    display:grid; grid-template-columns:auto 1fr; gap:1.4rem; align-items:flex-start;
    background:var(--white); border:1px solid rgba(107,74,48,0.14); border-radius:var(--radius-lg);
    padding:clamp(1.8rem,4vw,2.6rem); box-shadow:var(--shadow-card);
  }
  @media (max-width:640px){ .meaning-box{grid-template-columns:1fr;} }
  .meaning-icon{width:52px; height:52px; border-radius:14px; background:var(--sage-pale); display:grid; place-items:center; flex-shrink:0;}
  .meaning-icon svg{width:26px; height:26px; stroke:var(--forest); fill:none; stroke-width:1.6;}
  .meaning-box h3{font-size:1.5rem;}
  .meaning-box p{margin-top:0.9rem; color:var(--ink-soft); font-size:1rem;}
  .status-badge{
    display:inline-flex; align-items:center; gap:0.4rem; margin-top:1.3rem;
    font-family:var(--font-caption); font-size:0.72rem; font-weight:600; letter-spacing:0.06em; text-transform:uppercase;
    color:var(--brown); background:var(--beige-warm); border:1px dashed var(--gold); padding:0.5rem 0.9rem; border-radius:999px;
  }
  .status-badge svg{width:13px; height:13px; stroke:var(--brown);}
  .meaning-invite{
    margin-top:1.4rem; font-family:var(--font-caption); font-size:0.86rem; color:var(--emerald); font-weight:600;
  }

  /* ---------- Mbororo community: distinction grid ---------- */
  .distinction-grid{display:grid; grid-template-columns:1fr 1fr; gap:1.6rem;}
  @media (max-width:820px){ .distinction-grid{grid-template-columns:1fr;} }
  .distinction-card{
    background:var(--white); border-radius:var(--radius-lg); padding:clamp(1.8rem,3.5vw,2.3rem);
    border:1px solid rgba(107,74,48,0.1); box-shadow:var(--shadow-card);
  }
  .distinction-card.is-local{border-top:4px solid var(--gold);}
  .distinction-card.is-broader{border-top:4px solid var(--sage);}
  .distinction-card h3{font-size:1.2rem; display:flex; align-items:center; gap:0.6rem;}
  .distinction-card h3 svg{width:20px; height:20px; stroke:var(--emerald); flex-shrink:0;}
  .distinction-card p{margin-top:1rem; color:var(--ink-soft); font-size:0.95rem;}
  .distinction-card ul{margin-top:1.1rem; display:flex; flex-direction:column; gap:0.6rem;}
  .distinction-card li{font-size:0.9rem; color:var(--ink-soft); padding-left:1.1rem; position:relative;}
  .distinction-card li::before{content:"—"; position:absolute; left:0; color:var(--gold);}

  /* ---------- values grid ---------- */
  .values-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:1.1rem;}
  @media (max-width:920px){ .values-grid{grid-template-columns:repeat(2,1fr);} }
  @media (max-width:520px){ .values-grid{grid-template-columns:1fr;} }
  .value-card{
    background:var(--white); border-radius:var(--radius-md); padding:1.6rem 1.4rem;
    border:1px solid rgba(107,74,48,0.1); display:flex; flex-direction:column; gap:0.8rem;
    transition:transform 0.4s var(--ease), box-shadow 0.4s var(--ease);
  }
  .value-card:hover{transform:translateY(-6px); box-shadow:var(--shadow-card);}
  .value-icon{width:44px; height:44px; border-radius:12px; background:var(--sage-pale); display:grid; place-items:center;}
  .value-icon svg{width:22px; height:22px; stroke:var(--forest); fill:none; stroke-width:1.6;}
  .value-card h4{font-size:1.02rem;}
  .value-card p{font-size:0.85rem; color:var(--ink-soft);}

  /* ---------- leadership grid ---------- */
  .leadership-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:1.4rem;}
  @media (max-width:1000px){ .leadership-grid{grid-template-columns:repeat(2,1fr);} }
  @media (max-width:560px){ .leadership-grid{grid-template-columns:1fr;} }
  .leader-card{background:var(--white); border-radius:var(--radius-lg); overflow:hidden; box-shadow:var(--shadow-card); border:1px solid rgba(107,74,48,0.08);}
  .leader-card .ph{border-radius:0; min-height:260px;}
  .leader-body{padding:1.3rem 1.2rem 1.5rem;}
  .leader-role{font-family:var(--font-caption); font-size:0.68rem; text-transform:uppercase; letter-spacing:0.08em; color:var(--gold); font-weight:600;}
  .leader-card h4{font-size:1.05rem; margin-top:0.4rem;}
  .leader-card p{font-size:0.82rem; color:var(--ink-soft); margin-top:0.4rem;}

  /* ---------- community voices (spotlight reuse) ---------- */
  .spotlight{background:var(--sage-pale);}
  .spotlight-grid{display:grid; grid-template-columns:0.8fr 1.2fr; gap:clamp(2rem,5vw,4rem); align-items:center;}
  @media (max-width:920px){ .spotlight-grid{grid-template-columns:1fr;} }
  .spotlight-portrait{position:relative;}
  .spotlight-portrait .ph{box-shadow:var(--shadow-soft); min-height:440px;}
  .spotlight-role{
    position:absolute; bottom:-1.1rem; left:1.4rem; right:1.4rem;
    background:var(--white); border-radius:var(--radius-sm); padding:0.9rem 1.1rem;
    box-shadow:var(--shadow-card); font-family:var(--font-caption); font-size:0.78rem; color:var(--ink-soft);
  }
  .spotlight-role strong{display:block; font-family:var(--font-display); font-size:1.05rem; color:var(--forest-deep); font-weight:600;}
  .spotlight-body h3{font-size:clamp(1.8rem,3vw,2.3rem); margin-top:0.9rem;}
  .spotlight-body p{margin-top:1.1rem; color:var(--ink-soft); font-size:1.02rem;}
  .spotlight-body .btn{margin-top:1.6rem;}

  /* ---------- timeline ---------- */
  .timeline-scroller{
    display:grid; grid-auto-flow:column; grid-auto-columns:minmax(240px, 1fr);
    gap:0; overflow-x:auto; padding-bottom:1.5rem; padding-top:0.5rem;
    margin-inline:calc(var(--edge) * -1); padding-inline:var(--edge);
  }
  .timeline-scroller::-webkit-scrollbar{height:6px;}
  .timeline-scroller::-webkit-scrollbar-thumb{background:var(--sage); border-radius:6px;}
  .timeline-item{position:relative; padding:1.6rem 1.4rem 0; border-top:3px solid var(--gold);}
  .timeline-item.is-unknown{border-top-color:var(--sage);}
  .timeline-item::before{
    content:""; position:absolute; top:-8px; left:1.4rem; width:13px; height:13px; border-radius:50%;
    background:var(--gold); border:3px solid var(--beige);
  }
  .timeline-item.is-unknown::before{background:var(--sage);}
  .timeline-date{font-family:var(--font-caption); font-size:0.72rem; font-weight:600; letter-spacing:0.06em; text-transform:uppercase; color:var(--brown);}
  .timeline-item h4{font-size:1.02rem; margin-top:0.5rem;}
  .timeline-item p{font-size:0.85rem; color:var(--ink-soft); margin-top:0.5rem; max-width:26ch;}

  /* ---------- evidence (reused) ---------- */
  .evidence{background:var(--forest-deep); color:var(--sage-pale);}
  .evidence .eyebrow{color:var(--gold-soft);}
  .evidence .eyebrow::before{background:var(--gold-soft);}
  .evidence .section-head h2{color:var(--white);}
  .evidence .section-head p{color:rgba(228,232,222,0.78);}
  .evidence-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:1px; background:rgba(228,232,222,0.14); border-radius:var(--radius-md); overflow:hidden; border:1px solid rgba(228,232,222,0.14);}
  @media (max-width:880px){ .evidence-grid{grid-template-columns:repeat(2,1fr);} }
  .evidence-cell{background:rgba(228,232,222,0.04); padding:1.9rem 1.5rem; display:flex; flex-direction:column; gap:0.6rem;}
  .evidence-cell svg{width:22px; height:22px; stroke:var(--gold-soft); fill:none; stroke-width:1.6;}
  .evidence-cell strong{font-family:var(--font-display); font-size:1rem; color:var(--white); font-weight:600;}
  .evidence-cell span{font-size:0.82rem; color:rgba(228,232,222,0.72);}

  /* ---------- related archive (explore-card reuse) ---------- */
  .explore-grid{display:grid; grid-template-columns:repeat(5,1fr); gap:1.2rem;}
  @media (max-width:1080px){ .explore-grid{grid-template-columns:repeat(2,1fr);} }
  @media (max-width:600px){ .explore-grid{grid-template-columns:1fr;} }
  .explore-card{
    position:relative; border-radius:var(--radius-lg); overflow:hidden; min-height:220px;
    display:flex; align-items:flex-end; text-decoration:none; color:var(--white); box-shadow:var(--shadow-card);
  }
  .explore-card::before{content:""; position:absolute; inset:0; background:linear-gradient(160deg, var(--forest) 0%, var(--forest-deep) 100%); transition:transform 0.6s var(--ease);}
  .explore-card:nth-child(2)::before{background:linear-gradient(160deg, var(--emerald) 0%, var(--forest) 100%);}
  .explore-card:nth-child(3)::before{background:linear-gradient(160deg, var(--brown) 0%, #4a3320 100%);}
  .explore-card:nth-child(4)::before{background:linear-gradient(160deg, #3a5c4c 0%, var(--forest-deep) 100%);}
  .explore-card:nth-child(5)::before{background:linear-gradient(160deg, var(--gold) 0%, var(--brown) 100%);}
