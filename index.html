<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wouro Yobi Living Archive — Every Community Has a Story</title>
<meta name="description" content="Wouro Yobi is a Mbororo community in the Adamawa Region of Cameroon. Discover its place within the wider story of Cameroon, the Adamawa Plateau and the Mbororo people, documented by its own people.">
<meta property="og:title" content="Wouro Yobi Living Archive">
<meta property="og:description" content="Every community has a story. This is Wouro Yobi's — situated within the history of Cameroon, the Adamawa Region and the Mbororo people.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Inter:wght@400;500;600&family=Inter+Tight:wght@500;600&display=swap" rel="stylesheet">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "name": "Wouro Yobi Living Archive",
  "description": "A community-led digital heritage and knowledge platform documenting Wouro Yobi, a Mbororo community in the Adamawa Region of Cameroon.",
  "publisher": { "@type": "Organization", "name": "Wouro Yobi Living Archive" }
}
</script>
<style>
  /* ============================================================
     DESIGN TOKENS — frozen across the archive.
     ============================================================ */
  :root{
    --forest: #16332A; --forest-deep: #0E211B; --emerald: #2E6B54;
    --sage: #A9BBA2; --sage-pale: #E4E8DE; --beige: #F3EEE1; --beige-warm: #ECE3CE;
    --brown: #6B4A30; --gold: #C79A4B; --gold-soft: #E4C583;
    --ink: #1E2420; --ink-soft: #4B564E; --white: #FFFFFF;
    --font-display: 'Poppins', sans-serif; --font-body: 'Inter', sans-serif; --font-caption: 'Inter Tight', sans-serif;
    --max-w: 1280px; --edge: clamp(1.5rem, 5vw, 4.5rem);
    --radius-lg: 28px; --radius-md: 16px; --radius-sm: 8px;
    --shadow-soft: 0 20px 60px -25px rgba(14,33,27,0.35);
    --shadow-card: 0 12px 34px -18px rgba(14,33,27,0.28);
    --ease: cubic-bezier(.22,1,.36,1);
  }
  *,*::before,*::after{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  @media (prefers-reduced-motion: reduce){
    html{scroll-behavior:auto;}
    *{animation-duration:0.01ms !important; animation-iteration-count:1 !important; transition-duration:0.01ms !important; scroll-behavior:auto !important;}
  }
  body{margin:0; font-family:var(--font-body); color:var(--ink); background:var(--beige); -webkit-font-smoothing:antialiased; line-height:1.6;}
  img{max-width:100%; display:block;}
  a{color:inherit;}
  h1,h2,h3,h4{font-family:var(--font-display); margin:0; color:var(--forest-deep); font-weight:600; letter-spacing:-0.01em;}
  p{margin:0;} ul{margin:0; padding:0; list-style:none;} button{font-family:inherit; cursor:pointer;}
  :focus-visible{outline:2.5px solid var(--gold); outline-offset:3px; border-radius:4px;}
  .visually-hidden{position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0;}
  .wrap{max-width:var(--max-w); margin:0 auto; padding-inline:var(--edge);}
  .eyebrow{font-family:var(--font-caption); font-size:0.75rem; letter-spacing:0.16em; text-transform:uppercase; color:var(--emerald); font-weight:600; display:inline-flex; align-items:center; gap:0.6em;}
  .eyebrow::before{content:""; width:22px; height:1.5px; background:var(--gold); display:inline-block;}
  .reveal{opacity:0; transform:translateY(28px); transition:opacity 0.9s var(--ease), transform 0.9s var(--ease);}
  .reveal.is-visible{opacity:1; transform:none;}
  .reveal-stagger > *{transition-delay:calc(var(--i,0) * 90ms);}
  .skip-link{position:absolute; left:1rem; top:-4rem; background:var(--forest-deep); color:var(--white); padding:0.8rem 1.2rem; border-radius:var(--radius-sm); z-index:300; transition:top 0.25s var(--ease); font-family:var(--font-caption); font-weight:600;}
  .skip-link:focus{top:1rem;}
  .reading-progress{position:fixed; top:0; left:0; height:3px; width:0%; background:var(--gold); z-index:250; transition:width 0.1s linear;}

  /* ---------- header / nav — permanent, frozen ---------- */
  header.site-header{position:sticky; top:0; z-index:100; background:rgba(243,238,225,0.86); backdrop-filter:blur(14px) saturate(140%); border-bottom:1px solid rgba(107,74,48,0.14);}
  .nav-row{max-width:var(--max-w); margin:0 auto; padding:1.05rem var(--edge); display:flex; align-items:center; justify-content:space-between; gap:1.5rem;}
  .brand{display:flex; align-items:center; gap:0.7rem; text-decoration:none;}
  .brand-mark{width:38px; height:38px; border-radius:50%; background:conic-gradient(from 210deg, var(--forest), var(--emerald), var(--gold), var(--forest)); display:grid; place-items:center; flex-shrink:0; box-shadow:inset 0 0 0 3px var(--beige);}
  .brand-mark span{width:12px; height:12px; border-radius:50%; background:var(--beige);}
  .brand-name{font-family:var(--font-display); font-size:1.02rem; font-weight:600; color:var(--forest-deep); line-height:1.1;}
  .brand-name small{display:block; font-family:var(--font-caption); font-weight:500; font-size:0.68rem; letter-spacing:0.08em; text-transform:uppercase; color:var(--brown); margin-top:0.2rem;}
  nav.primary-nav ul{display:flex; gap:1.4rem; align-items:center; flex-wrap:wrap;}
  nav.primary-nav a{font-family:var(--font-caption); font-size:0.83rem; font-weight:500; text-decoration:none; color:var(--ink-soft); position:relative; padding-bottom:4px;}
  nav.primary-nav a::after{content:""; position:absolute; left:0; bottom:0; height:1.5px; width:0; background:var(--gold); transition:width 0.3s var(--ease);}
  nav.primary-nav a:hover::after, nav.primary-nav a:focus-visible::after{width:100%;}
  nav.primary-nav a[aria-current="page"]{color:var(--forest-deep);}
  nav.primary-nav a[aria-current="page"]::after{width:100%;}
  .nav-actions{display:flex; align-items:center; gap:0.8rem;}
  .btn{font-family:var(--font-caption); font-weight:600; font-size:0.85rem; padding:0.75rem 1.5rem; border-radius:999px; border:1.5px solid transparent; text-decoration:none; display:inline-flex; align-items:center; gap:0.5rem; transition:transform 0.35s var(--ease), background 0.35s var(--ease), color 0.35s var(--ease), border-color .35s var(--ease);}
  .btn-primary{background:var(--forest-deep); color:var(--beige);}
  .btn-primary:hover{background:var(--emerald); transform:translateY(-2px);}
  .btn-ghost{border-color:var(--forest-deep); color:var(--forest-deep);}
  .btn-ghost:hover{background:var(--forest-deep); color:var(--beige); transform:translateY(-2px);}
  .btn-gold{background:var(--gold); color:var(--forest-deep);}
  .btn-gold:hover{background:var(--gold-soft); transform:translateY(-2px);}
  .btn-sm{padding:0.55rem 1.1rem; font-size:0.78rem;}
  .nav-toggle{display:none; background:none; border:none; padding:0.4rem;}
  @media (max-width:1140px){ nav.primary-nav, .nav-actions .btn-ghost{display:none;} .nav-toggle{display:block;} }

  /* ---------- placeholder / reference image components ---------- */
  .ph{position:relative; overflow:hidden; background:linear-gradient(135deg, var(--sage-pale) 0%, var(--beige-warm) 55%, var(--sage-pale) 100%); border-radius:var(--radius-md); display:flex; align-items:flex-end; isolation:isolate; min-height:180px;}
  .ph::before{content:""; position:absolute; inset:0; background-image:repeating-linear-gradient(115deg, rgba(107,74,48,0.05) 0 2px, transparent 2px 26px), repeating-linear-gradient(25deg, rgba(46,107,84,0.05) 0 2px, transparent 2px 26px); z-index:0;}
  .ph::after{content:""; position:absolute; inset:0; z-index:0; background:radial-gradient(circle at 30% 20%, rgba(199,154,75,0.18), transparent 45%), radial-gradient(circle at 75% 80%, rgba(22,51,42,0.14), transparent 50%);}
  .ph-icon{position:absolute; top:1.1rem; right:1.1rem; z-index:1; width:34px; height:34px; border-radius:50%; background:rgba(255,255,255,0.55); backdrop-filter:blur(4px); display:grid; place-items:center;}
  .ph-icon svg{width:16px; height:16px; stroke:var(--forest-deep);}
  .ph-caption{position:relative; z-index:1; width:100%; padding:0.9rem 1.1rem; margin:0; background:linear-gradient(to top, rgba(14,33,27,0.72), rgba(14,33,27,0)); color:var(--white);}
  .ph-caption .fname{font-family:var(--font-caption); font-size:0.78rem; font-weight:600; letter-spacing:0.02em;}
  .ph-caption .fdesc{display:block; font-size:0.72rem; opacity:0.85; margin-top:0.15rem;}
  .ph-caption .fdim{display:block; font-family:var(--font-caption); font-size:0.66rem; opacity:0.7; margin-top:0.35rem; letter-spacing:0.04em;}
  .ph-square{aspect-ratio:1/1;} .ph-portrait{aspect-ratio:3/4;} .ph-wide{aspect-ratio:16/9;} .ph-panorama{aspect-ratio:21/9;}
  .ref{position:relative; overflow:hidden; border-radius:var(--radius-md); background:linear-gradient(150deg, var(--sage) 0%, var(--forest) 100%); display:flex; align-items:flex-end; min-height:180px;}
  .ref::before{content:""; position:absolute; inset:0; background-image:repeating-linear-gradient(70deg, rgba(255,255,255,0.06) 0 3px, transparent 3px 22px); z-index:0;}
  .ref-badge{position:absolute; top:1.1rem; left:1.1rem; z-index:1; font-family:var(--font-caption); font-size:0.64rem; font-weight:600; letter-spacing:0.08em; text-transform:uppercase; background:rgba(255,255,255,0.9); color:var(--forest-deep); padding:0.32rem 0.7rem; border-radius:999px;}
  .ref-caption{position:relative; z-index:1; width:100%; padding:0.9rem 1.1rem; background:linear-gradient(to top, rgba(14,33,27,0.78), rgba(14,33,27,0)); color:var(--white);}
  .ref-caption .fname{font-family:var(--font-caption); font-size:0.78rem; font-weight:600;}
  .ref-caption .fdesc{display:block; font-size:0.72rem; opacity:0.85; margin-top:0.15rem;}
  .ref-panorama{aspect-ratio:21/9;} .ref-wide{aspect-ratio:16/9;}

  section{padding-block:clamp(4rem, 8vw, 7.5rem); position:relative;}
  .section-head{max-width:64ch; margin-bottom:clamp(2.2rem, 5vw, 3.6rem);}
  .section-head h2{font-size:clamp(2rem, 3.6vw, 3rem); margin-top:0.9rem;}
  .section-head p{margin-top:1.1rem; font-size:1.06rem; color:var(--ink-soft); max-width:56ch;}

  /* ---------- hero ---------- */
  .hero{position:relative; padding-top:clamp(2.5rem, 6vw, 4.5rem); padding-bottom:clamp(3rem, 7vw, 6rem); overflow:hidden;}
  .hero-bg-shape{position:absolute; top:-15%; right:-12%; width:60vw; height:60vw; max-width:900px; max-height:900px; border-radius:50%; background:radial-gradient(circle at 35% 35%, rgba(46,107,84,0.14), rgba(46,107,84,0) 65%); z-index:0; pointer-events:none;}
  .hero-grid{position:relative; z-index:1; display:grid; grid-template-columns:1.05fr 0.95fr; gap:clamp(2rem,4vw,4rem); align-items:center;}
  @media (max-width:940px){ .hero-grid{grid-template-columns:1fr;} }
  .hero h1{font-size:clamp(2.3rem, 4.6vw, 3.9rem); line-height:1.08; font-weight:600; color:var(--forest-deep);}
  .hero h1 em{font-style:normal; color:var(--emerald);}
  .hero-sub{margin-top:1.6rem; max-width:50ch; font-size:1.1rem; color:var(--ink-soft);}
  .hero-actions{margin-top:2.4rem; display:flex; flex-wrap:wrap; gap:1rem;}
  .hero-visual{position:relative;}
  .hero-visual .ref{min-height:440px; border-radius:var(--radius-lg); box-shadow:var(--shadow-soft);}

  /* ---------- knowledge passport (gamification) ---------- */
  .passport-bar{background:var(--white); border-bottom:1px solid rgba(107,74,48,0.14);}
  .passport-bar .wrap{padding-block:1.2rem; display:flex; align-items:center; justify-content:space-between; gap:1.2rem; flex-wrap:wrap;}
  .passport-label{display:flex; align-items:center; gap:0.6rem; font-family:var(--font-caption); font-size:0.8rem; color:var(--ink-soft);}
  .passport-label svg{width:16px; height:16px; stroke:var(--gold);}
  .passport-stamps{display:flex; gap:0.4rem;}
  .passport-stamp{width:26px; height:26px; border-radius:50%; border:1.5px dashed var(--sage); display:grid; place-items:center;}
  .passport-stamp.is-stamped{border-style:solid; border-color:var(--gold); background:var(--sage-pale);}
  .passport-stamp svg{width:12px; height:12px; stroke:var(--emerald);}

  /* ---------- narrative sections: Cameroon / Adamawa / Mbororo ---------- */
  .narrative{background:var(--white);}
  .narrative.is-alt{background:var(--sage-pale);}
  .narrative-grid{display:grid; grid-template-columns:1.4fr 1fr; gap:clamp(2rem,4vw,3.5rem); align-items:start;}
  @media (max-width:920px){ .narrative-grid{grid-template-columns:1fr;} }
  .narrative-body p{margin-top:1.1rem; color:var(--ink-soft); font-size:1.02rem; max-width:62ch;}
  .narrative-body p:first-of-type{margin-top:0.9rem;}
  .narrative-media-grid{display:grid; grid-template-columns:1fr 1fr; gap:0.9rem; margin-top:1.6rem;}
  .narrative-media-grid .span-2{grid-column:span 2;}
  .narrative-tags{display:flex; flex-wrap:wrap; gap:0.5rem; margin-top:1.4rem;}
  .narrative-tags li{font-family:var(--font-caption); font-size:0.72rem; padding:0.32rem 0.75rem; border-radius:999px; background:var(--beige-warm); color:var(--brown);}
  .narrative-scope{margin-top:1.2rem; padding:0.9rem 1.1rem; border-left:3px solid var(--gold); background:var(--beige-warm); border-radius:var(--radius-sm); font-family:var(--font-caption); font-size:0.82rem; color:var(--brown);}

  /* ---------- knowledge panel ---------- */
  .knowledge-panel{background:var(--beige-warm); border:1px solid rgba(107,74,48,0.18); border-radius:var(--radius-md); padding:1.5rem 1.6rem;}
  .knowledge-panel h4{font-family:var(--font-caption); font-size:0.72rem; letter-spacing:0.12em; text-transform:uppercase; color:var(--brown); font-weight:600; margin-bottom:0.9rem; display:flex; align-items:center; gap:0.5rem;}
  .knowledge-panel h4 svg{width:14px; height:14px; stroke:var(--brown);}
  .knowledge-panel ul{display:flex; flex-direction:column; gap:0.55rem;}
  .knowledge-panel a{display:flex; justify-content:space-between; align-items:center; gap:0.6rem; text-decoration:none; font-family:var(--font-caption); font-size:0.85rem; color:var(--forest-deep); padding:0.4rem 0; border-bottom:1px dashed rgba(107,74,48,0.22);}
  .knowledge-panel a:last-child{border-bottom:none;}
  .knowledge-panel a span.src{color:var(--ink-soft); font-weight:400;}
  .knowledge-panel a svg{width:12px; height:12px; stroke:var(--emerald); flex-shrink:0;}

  /* ---------- did you know ---------- */
  .dyk{background:var(--white); border:1px solid rgba(107,74,48,0.16); border-radius:var(--radius-md); overflow:hidden; margin-top:1.4rem;}
  .dyk summary{list-style:none; cursor:pointer; padding:1.1rem 1.4rem; display:flex; align-items:center; gap:0.8rem; font-family:var(--font-caption); font-weight:600; font-size:0.92rem; color:var(--forest-deep);}
  .dyk summary::-webkit-details-marker{display:none;}
  .dyk summary .dyk-icon{width:30px; height:30px; border-radius:50%; background:var(--sage-pale); display:grid; place-items:center; flex-shrink:0;}
  .dyk summary .dyk-icon svg{width:15px; height:15px; stroke:var(--forest);}
  .dyk summary .dyk-chevron{margin-left:auto; width:16px; height:16px; stroke:var(--brown); transition:transform 0.3s var(--ease);}
  .dyk[open] summary .dyk-chevron{transform:rotate(180deg);}
  .dyk-body{padding:0 1.4rem 1.3rem 4.2rem; font-size:0.9rem; color:var(--ink-soft);}

  /* ---------- discover wouro yobi + map explorer ---------- */
  .discover-grid{display:grid; grid-template-columns:1fr 1fr; gap:clamp(2rem,4vw,3rem); align-items:start;}
  @media (max-width:920px){ .discover-grid{grid-template-columns:1fr;} }
  .discover-facts{display:grid; grid-template-columns:1fr 1fr; gap:0.9rem; margin-top:1.6rem;}
  .discover-fact{background:var(--white); border-radius:var(--radius-sm); padding:1rem 1.1rem; border:1px solid rgba(107,74,48,0.12);}
  .discover-fact h5{font-family:var(--font-caption); font-size:0.68rem; text-transform:uppercase; letter-spacing:0.07em; color:var(--brown);}
  .discover-fact p{margin-top:0.3rem; font-family:var(--font-display); font-size:0.98rem; color:var(--forest-deep); font-weight:600;}
  .map-frame{border-radius:var(--radius-lg); overflow:hidden; box-shadow:var(--shadow-card); border:1px solid rgba(107,74,48,0.14); background:var(--sage-pale);}
  .map-frame iframe{width:100%; height:340px; border:0; display:block; filter:saturate(0.85);}
  .map-legend{padding:1.1rem 1.4rem; background:var(--white); display:flex; flex-wrap:wrap; gap:0.6rem;}
  .map-legend span{font-family:var(--font-caption); font-size:0.72rem; color:var(--forest-deep); background:var(--sage-pale); padding:0.3rem 0.7rem; border-radius:999px; display:inline-flex; align-items:center; gap:0.35rem;}
  .map-legend span::before{content:""; width:6px; height:6px; border-radius:50%; background:var(--gold);}
  .map-actions{display:flex; gap:0.6rem; flex-wrap:wrap; margin-top:1rem;}

  /* ---------- historical timeline ---------- */
  .timeline-track{
    display:grid; grid-auto-flow:column; grid-auto-columns:minmax(240px,1fr); gap:0;
    overflow-x:auto; padding-top:2rem; padding-bottom:1rem;
    margin-inline:calc(var(--edge) * -1); padding-inline:var(--edge);
  }
  .timeline-track::-webkit-scrollbar{height:6px;}
  .timeline-track::-webkit-scrollbar-thumb{background:var(--emerald); border-radius:6px;}
  .timeline-stop{position:relative; padding:1.8rem 1.4rem 0; scroll-margin-left:var(--edge);}
  .timeline-stop::before{content:""; position:absolute; top:0; left:0; right:0; height:3px; background:rgba(228,232,222,0.25);}
  .timeline-stop::after{content:""; position:absolute; top:-7px; left:1.4rem; width:16px; height:16px; border-radius:50%; background:var(--gold); border:3px solid var(--forest-deep);}
  .timeline-stop.is-community::after{background:var(--white);}
  .timeline-era{font-family:var(--font-caption); font-size:0.68rem; text-transform:uppercase; letter-spacing:0.08em; color:var(--gold-soft);}
  .timeline-stop h4{font-size:1.05rem; color:var(--white); margin-top:0.5rem;}
  .timeline-stop p{font-size:0.86rem; color:rgba(228,232,222,0.78); margin-top:0.6rem; max-width:25ch;}
  .timeline-stop a{display:inline-flex; align-items:center; gap:0.3rem; margin-top:0.7rem; font-family:var(--font-caption); font-size:0.76rem; font-weight:600; color:var(--gold-soft); text-decoration:none;}

  /* ---------- explore the living archive: nine cards ---------- */
  .explore-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:1.2rem;}
  @media (max-width:900px){ .explore-grid{grid-template-columns:repeat(2,1fr);} }
  @media (max-width:560px){ .explore-grid{grid-template-columns:1fr;} }
  .explore-card{position:relative; border-radius:var(--radius-lg); overflow:hidden; min-height:200px; display:flex; align-items:flex-end; text-decoration:none; color:var(--white); box-shadow:var(--shadow-card);}
  .explore-card::before{content:""; position:absolute; inset:0; background:linear-gradient(160deg, var(--forest) 0%, var(--forest-deep) 100%); transition:transform 0.6s var(--ease);}
  .explore-card:nth-child(9n+2)::before{background:linear-gradient(160deg, var(--emerald) 0%, var(--forest) 100%);}
  .explore-card:nth-child(9n+3)::before{background:linear-gradient(160deg, var(--brown) 0%, #4a3320 100%);}
  .explore-card:nth-child(9n+4)::before{background:linear-gradient(160deg, #3a5c4c 0%, var(--forest-deep) 100%);}
  .explore-card:nth-child(9n+5)::before{background:linear-gradient(160deg, var(--gold) 0%, var(--brown) 100%);}
  .explore-card:nth-child(9n+6)::before{background:linear-gradient(160deg, var(--sage) 0%, var(--forest) 100%);}
  .explore-card:nth-child(9n+7)::before{background:linear-gradient(160deg, var(--forest) 0%, var(--brown) 100%);}
  .explore-card:nth-child(9n+8)::before{background:linear-gradient(160deg, var(--emerald) 0%, var(--forest-deep) 100%);}
  .explore-card:nth-child(9n+9)::before{background:linear-gradient(160deg, var(--brown) 0%, var(--forest) 100%);}
  .explore-card:hover::before{transform:scale(1.06);}
  .explore-content{position:relative; z-index:1; padding:1.4rem 1.3rem;}
  .explore-content .eyebrow{color:var(--gold-soft); font-size:0.66rem;} .explore-content .eyebrow::before{background:var(--gold-soft);}
  .explore-content h3{color:var(--white); font-size:1.1rem; margin-top:0.5rem;}
  .explore-content p{font-size:0.78rem; color:rgba(255,255,255,0.78); margin-top:0.45rem;}

  /* ---------- featured story ---------- */
  .featured-story{display:grid; grid-template-columns:1fr 1fr; gap:clamp(2rem,4vw,3.5rem); align-items:center;}
  @media (max-width:920px){ .featured-story{grid-template-columns:1fr;} }
  .featured-story p{margin-top:1.1rem; color:var(--ink-soft); font-size:1.02rem;}
  .featured-story .btn{margin-top:1.6rem;}

  /* ---------- knowledge journey grid ---------- */
  .journey-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:1.1rem;}
  @media (max-width:880px){ .journey-grid{grid-template-columns:repeat(2,1fr);} }
